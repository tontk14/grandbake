<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ตะกร้าสินค้า | Grand Bake</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Prompt", sans-serif;
            background: #fcf8f4;
            color: #4f3528;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            width: 100%;
            height: 78px;
            background: #fff;
            border-bottom: 1px solid #eadfd7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo img {
            width: 125px;
            height: auto;
            display: block;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .menu > a {
            font-size: 15px;
            color: #604638;
            transition: 0.2s;
        }

        .menu > a:hover {
            color: #9a5b3c;
        }

        .cart-icon {
            font-size: 20px !important;
        }


        /* =========================
           CART
        ========================= */

        .cart-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;

            padding: 65px 25px 90px;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .cart-title h1 {
            font-family: "Noto Serif Thai", serif;
            font-size: 38px;
            color: #563525;
            margin-bottom: 8px;
        }

        .cart-title p {
            color: #8a7062;
            font-size: 15px;
        }


        /* =========================
           CART LIST
        ========================= */

        .cart-box {
            background: #fff;
            border-radius: 22px;
            padding: 25px;

            box-shadow: 0 12px 40px rgba(80, 50, 35, 0.08);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto auto;
            align-items: center;

            gap: 20px;

            padding: 20px 0;

            border-bottom: 1px solid #eee3db;
        }

        .cart-item:first-child {
            padding-top: 5px;
        }

        .cart-item:last-child {
            border-bottom: none;
        }


        /* IMAGE */

        .cart-image {
            width: 100px;
            height: 100px;

            object-fit: cover;

            border-radius: 15px;
            background: #f3ebe4;
        }


        /* PRODUCT */

        .cart-product h3 {
            font-family: "Noto Serif Thai", serif;
            font-size: 20px;
            color: #563525;

            margin-bottom: 5px;
        }

        .cart-product p {
            color: #9a7c6d;
            font-size: 14px;
        }


        /* PRICE */

        .cart-price {
            font-size: 17px;
            font-weight: 500;
            color: #8b4f32;

            min-width: 90px;
            text-align: right;
        }


        /* =========================
           QUANTITY
        ========================= */

        .cart-quantity {
            display: flex;
            align-items: center;

            border: 1px solid #ddcec3;
            border-radius: 25px;

            overflow: hidden;
        }

        .cart-quantity button {
            width: 35px;
            height: 35px;

            border: none;
            background: #faf5f0;

            color: #714936;
            font-size: 17px;

            cursor: pointer;
        }

        .cart-quantity button:hover {
            background: #eee2d8;
        }

        .cart-quantity span {
            width: 35px;
            text-align: center;
            font-size: 14px;
        }


        /* =========================
           DELETE
        ========================= */

        .delete-button {
            border: none;
            background: none;

            color: #a67c69;

            font-size: 18px;

            cursor: pointer;
        }

        .delete-button:hover {
            color: #9a4e35;
        }


        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            font-family: "Noto Serif Thai", serif;
            font-size: 25px;
            color: #563525;

            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #8a7062;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 48px;
            padding: 0 28px;

            border-radius: 25px;

            background: #7d4930;
            color: white;

            font-size: 15px;
        }

        .shop-button:hover {
            background: #633822;
        }


        /* =========================
           SUMMARY
        ========================= */

        .cart-summary {
            margin-top: 25px;

            background: #fff;

            border-radius: 22px;

            padding: 25px;

            box-shadow: 0 12px 40px rgba(80, 50, 35, 0.08);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 8px 0;

            font-size: 15px;
            color: #765d50;
        }

        .summary-total {
            border-top: 1px solid #eadfd7;

            margin-top: 12px;
            padding-top: 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-total span:first-child {
            font-size: 18px;
            font-weight: 500;
        }

        .summary-total span:last-child {
            font-size: 27px;
            font-weight: 600;

            color: #8b4f32;
        }


        /* =========================
           CHECKOUT
        ========================= */

        .checkout-button {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 28px;

            margin-top: 22px;

            background: #7d4930;
            color: white;

            font-family: "Prompt", sans-serif;
            font-size: 16px;
            font-weight: 500;

            cursor: pointer;

            transition: 0.25s;
        }

        .checkout-button:hover {
            background: #633822;
            transform: translateY(-2px);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                padding: 0 20px;
            }

            .menu {
                gap: 15px;
            }

            .menu > a:not(.cart-icon) {
                display: none;
            }

            .cart-container {
                padding: 40px 15px 60px;
            }

            .cart-title h1 {
                font-size: 30px;
            }

            .cart-item {
                grid-template-columns: 80px 1fr auto;
                gap: 12px;
            }

            .cart-image {
                width: 80px;
                height: 80px;
            }

            .cart-price {
                grid-column: 2;
                text-align: left;
            }

            .cart-quantity {
                grid-column: 3;
                grid-row: 1;
            }

            .delete-button {
                grid-column: 3;
                grid-row: 2;
            }
        }

    </style>
</head>

<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            <a href="index.html">
                <img src="logo.jpg" alt="Grand Bake">
            </a>
        </div>

        <div class="menu">

            <a href="index.html">
                หน้าแรก
            </a>

            <a href="products.html">
                สินค้า
            </a>

            <a href="#">
                เกี่ยวกับเรา
            </a>

            <a href="#">
                ติดต่อเรา
            </a>

            <a href="cart.html" class="cart-icon">
                🛒
            </a>

        </div>

    </nav>


    <!-- =========================
         CART
    ========================== -->

    <main class="cart-container">

        <div class="cart-title">

            <h1>
                ตะกร้าสินค้า
            </h1>

            <p>
                ตรวจสอบรายการสินค้าและจำนวนที่คุณเลือก
            </p>

        </div>


        <div id="cartContent"></div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function getCart() {

            return JSON.parse(
                localStorage.getItem("grandBakeCart")
            ) || [];

        }


        function saveCart(cart) {

            localStorage.setItem(
                "grandBakeCart",
                JSON.stringify(cart)
            );

        }


        /* =========================
           DISPLAY CART
        ========================== */

        function renderCart() {

            const cart = getCart();

            const cartContent =
                document.getElementById("cartContent");


            /* EMPTY */

            if (cart.length === 0) {

                cartContent.innerHTML = `

                    <div class="cart-box">

                        <div class="empty-cart">

                            <div class="empty-cart-icon">
                                🛒
                            </div>

                            <h2>
                                ยังไม่มีสินค้าในตะกร้า
                            </h2>

                            <p>
                                เลือกเค้กที่คุณชื่นชอบ
                                แล้วเพิ่มลงตะกร้าได้เลย
                            </p>

                            <a
                                href="products.html"
                                class="shop-button"
                            >
                                เลือกซื้อสินค้า
                            </a>

                        </div>

                    </div>

                `;

                return;
            }


            let total = 0;
            let totalItems = 0;


            /* CART ITEMS */

            let itemsHTML = "";

            cart.forEach((item, index) => {

                const itemTotal =
                    item.price * item.quantity;

                total += itemTotal;

                totalItems += item.quantity;


                itemsHTML += `

                    <div class="cart-item">

                        <img
                            class="cart-image"
                            src="${item.image}"
                            alt="${item.name}"
                        >


                        <div class="cart-product">

                            <h3>
                                ${item.name}
                            </h3>

                            <p>
                                ราคาต่อชิ้น ฿${item.price.toLocaleString()}
                            </p>

                        </div>


                        <div class="cart-quantity">

                            <button
                                onclick="changeCartQuantity(${index}, -1)"
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="changeCartQuantity(${index}, 1)"
                            >
                                +
                            </button>

                        </div>


                        <div class="cart-price">

                            ฿${itemTotal.toLocaleString()}

                        </div>


                        <button
                            class="delete-button"
                            onclick="removeCartItem(${index})"
                            title="ลบสินค้า"
                        >
                            🗑️
                        </button>

                    </div>

                `;

            });


            cartContent.innerHTML = `

                <div class="cart-box">

                    ${itemsHTML}

                </div>


                <div class="cart-summary">

                    <div class="summary-row">

                        <span>
                            จำนวนสินค้า
                        </span>

                        <span>
                            ${totalItems} ชิ้น
                        </span>

                    </div>


                    <div class="summary-total">

                        <span>
                            ยอดรวมทั้งหมด
                        </span>

                        <span>
                            ฿${total.toLocaleString()}
                        </span>

                    </div>


                    <button
                        class="checkout-button"
                        onclick="checkout()"
                    >
                        ดำเนินการสั่งซื้อ
                    </button>

                </div>

            `;

        }


        /* =========================
           CHANGE QUANTITY
        ========================== */

        function changeCartQuantity(index, amount) {

            const cart = getCart();

            cart[index].quantity += amount;


            if (cart[index].quantity <= 0) {

                cart.splice(index, 1);

            }


            saveCart(cart);

            renderCart();

        }


        /* =========================
           REMOVE ITEM
        ========================== */

        function removeCartItem(index) {

            const cart = getCart();

            cart.splice(index, 1);

            saveCart(cart);

            renderCart();

        }


        /* =========================
           CHECKOUT
        ========================== */

        function checkout() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("กรุณาเพิ่มสินค้าลงตะกร้าก่อน");

        return;
    }

    window.location.href = "checkout.php";

}


        /* =========================
           START
        ========================== */

        renderCart();

    </script>

</body>
</html>
